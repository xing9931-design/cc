[package]
name = "wclean"
version = "0.1.0"
edition = "2021"
description = "A safe, fast C: drive cleanup tool for Windows"
license = "MIT"
repository = "https://github.com/xing9931-design/cc"
readme = "README.md"

[[bin]]
name = "wclean"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
walkdir = "2"
owo-colors = "4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
] }

[profile.release]
opt-level = 3
lto = true
strip = true
