name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    name: Build & test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build CLI
        run: cargo build --release

      - name: Test
        run: cargo test --all

      # The GUI links against native windowing/graphics libraries; build it on
      # Windows where it actually ships.
      - name: Build GUI (Windows)
        if: runner.os == 'Windows'
        run: cargo build --release --features gui --bin wclean-gui
